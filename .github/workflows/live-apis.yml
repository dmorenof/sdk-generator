name: Live public APIs

# Generates SDKs from the unmodified specifications of public, free APIs and calls the real servers.
# Manual and weekly: the servers are shared and outside our control, so this never gates a merge.
on:
  workflow_dispatch:
    inputs:
      runtime_ref:
        description: 'Branch of sdk-runtime to run the generated SDKs on (default: the published runtime)'
        required: false
        default: ''
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

env:
  # A runtime change is proven here before it is published: run this workflow by hand with its branch.
  SDK_RUNTIME_REF: ${{ inputs.runtime_ref }}

jobs:
  petstore3:
    name: Swagger Petstore (OpenAPI 3.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Download the specification
        run: |
          mkdir -p live-results
          curl --fail --location --retry 3 --max-time 35 https://petstore3.swagger.io/api/v3/openapi.json -o live-results/petstore3.json
          sha256sum live-results/petstore3.json
      - name: Generate the SDK (strict)
        run: php bin/generate-sdk.php --strict live-results/petstore3.json live-results/petstore3-sdk 'Example\Petstore' example/petstore
      - name: Use the runtime of a branch, when asked
        if: env.SDK_RUNTIME_REF != ''
        run: |
          composer config --working-dir=live-results/petstore3-sdk repositories.runtime vcs https://github.com/dmorenof/sdk-runtime
          composer config --working-dir=live-results/petstore3-sdk minimum-stability dev
          composer require --working-dir=live-results/petstore3-sdk "dmorenof/sdk-runtime:dev-$SDK_RUNTIME_REF as 1.99.0" --no-update --no-interaction --quiet
      - run: composer install --working-dir=live-results/petstore3-sdk --no-interaction --prefer-dist --no-progress
      - name: Analyse the generated code at PHPStan max
        run: vendor/bin/phpstan analyse live-results/petstore3-sdk/src --level=max --autoload-file=live-results/petstore3-sdk/vendor/autoload.php --no-progress --memory-limit=2G
      - name: Call the real server
        run: php tests/live/petstore3_smoke.php
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: petstore3-live
          path: |
            live-results/petstore3.json
            live-results/petstore3-sdk/src/**
          retention-days: 14

  petstore2:
    name: Swagger Petstore (Swagger 2.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
