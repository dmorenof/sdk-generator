          name: petstore2-live
          path: |
            live-results/petstore2.json
            live-results/petstore2-sdk/src/**
          retention-days: 14

  frankfurter:
    name: Frankfurter (OpenAPI 3.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
