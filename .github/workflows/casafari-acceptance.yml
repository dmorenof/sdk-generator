name: Casafari 0.2.0 acceptance (strict)

on:
  workflow_dispatch:
  push:
    branches: ['release/0.2.0']
    paths:
      - '.github/workflows/casafari-acceptance.yml'
      - 'bin/check-openapi-acceptance.php'
      - 'tests/fixtures/casafari-openapi31.json'
      - 'src/**'
      - 'composer.json'

permissions:
  contents: read

jobs:
  casafari-acceptance:
    name: Full OpenAPI compatibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install generator
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify exact uploaded OpenAPI fixture (original CRLF bytes)
        run: |
          echo "d6dce87639a6a16b7f2aac2e17ab5845b21e4e7937e68fca20243442be15ba04  tests/fixtures/casafari-openapi31.json" | sha256sum --check
      - name: Analyze full contract and each operation against the pinned document
        run: |
          php bin/check-openapi-acceptance.php tests/fixtures/casafari-openapi31.json \
            --sha256 d6dce87639a6a16b7f2aac2e17ab5845b21e4e7937e68fca20243442be15ba04 \
            > "$RUNNER_TEMP/casafari-acceptance-report.json"
          # Intentionally fails until all operations and the complete spec generate.
      - name: Archive operation-level report on expected failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: casafari-0.2.0-acceptance
          path: ${{ runner.temp }}/casafari-acceptance-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Generate Casafari PHP SDK preview from the complete pinned contract
        run: |
          set -euo pipefail
          php bin/generate-sdk.php \
            tests/fixtures/casafari-openapi31.json \
            casafari-sdk \
            'Casafari\GeneratedSdk' \
            preview/casafari-generated-sdk
          find casafari-sdk/src -type f -name '*.php' -print0 | xargs -0 -r -P 8 -n1 php -l > /dev/null
          grep -E '^[[:space:]]*public static function ' casafari-sdk/src/Api.php > casafari-sdk/API-METHODS.txt
          cat > casafari-sdk/READ-FIRST.md <<'EOF'
          # Casafari generated SDK — 0.2.0 evaluation preview

          This package was generated by dmorenof/sdk-generator from the pinned,
          complete Casafari OpenAPI 3.1 fixture. It is a source-only Composer
          package for review, not a published release. It contains no
          API secrets, authentication tokens, or vendored dependencies.

          ## Quick start

          Install the generated Composer dependencies with `composer install`
          (PHP 8.3+). Then import:

          ```php
          use Casafari\GeneratedSdk\Api;
          use Casafari\GeneratedSdk\Client;
          use Casafari\GeneratedSdk\Configuration;
          use Dmorenof\SdkRuntime\Security\SecurityCredentials;

          $configuration = new Configuration();
          $configuration->baseUrl = 'https://api.casafari.com';
          $configuration->securityCredentials = new SecurityCredentials([
              'HTTPBearer' => $token,
          ]);
          Client::configure($configuration);

          // All methods are on Api; see API-METHODS.txt for exact signatures.
          ```

          The contract declares both HTTPBearer and PlatformApiKey as
          bearer security schemes. Populate only credentials appropriate for
          each operation. No calls to the live Casafari API were made.

          ## Evaluation points

          - Open `src/Api.php` to see every public static operation.
          - Open `API-METHODS.txt` for a searchable method signature index.
          - Inspect `src/DTOs`, `src/Requests`, and `src/Responses`;
            these models are not unified in this development snapshot.
          - `operationId` is used verbatim when a legal PHP identifier;
            names with double underscores remain awkward.
          - For simultaneous clients/concurrent long-lived workers,
            use independent instance clients rather than the static facade.

          Original fixture: tests/fixtures/casafari-openapi31.json in
          dmorenof/sdk-generator (release/0.2.0), SHA-256:
          d6dce87639a6a16b7f2aac2e17ab5845b21e4e7937e68fca20243442be15ba04
          EOF

      - name: Upload complete Casafari SDK preview (ZIP)
        uses: actions/upload-artifact@v7
        with:
          name: casafari-sdk-020-evaluation
          path: casafari-sdk/
          if-no-files-found: error
          retention-days: 30
